[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy._Backend"

[project]
name = "wordfix"
version = "0.1.0"
description = "Word Format Auto-Fixer - CLI tool dinh dang file Word"
readme = "spec_kit.md"
requires-python = ">=3.10"
dependencies = [
    "python-docx>=1.1.0",
    "PyYAML>=6.0",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
wordfix = "src.main:run"

[tool.setuptools.packages.find]
include = ["src*"]
